name: Release

# Builds installers and publishes them to a GitHub Release.
#
# macOS is signed with a Developer ID identity and notarized by Apple, so it
# installs without a Gatekeeper bypass. Windows has no Authenticode cert and is
# still unsigned — users bypass SmartScreen on first launch; see the "Install"
# section of README.md.
#
# Signing is conditional on the Apple secrets being present, so a fork without
# them still builds (ad-hoc signed, unnotarized).

on:
  push:
    tags:
      - 'v*'

# Least privilege by default. Exactly three jobs raise this to
# `contents: write` -- create-release, build and publish, the only ones that
# write to the GitHub Release -- so a step added to `quality` or `preflight`
# later cannot silently inherit a token that can push to main. `update-tap`
# goes the other way and drops to `permissions: {}`, because it uses a PAT.
permissions:
  contents: read

# One release at a time, repository-wide.
#
# The group is the workflow NAME and deliberately NOT `github.ref`: every tag is
# its own ref, so a ref-scoped group would put each release in a group of one
# and serialize nothing. Two `v*` tags pushed minutes apart would then reach
# `update-tap` together, and that job clones tstone-1/homebrew-dblitz, seds the
# same Casks/dblitz.rb and pushes to its main -- one push loses on a
# non-fast-forward, or the older version lands last and the tap advertises a
# release that is not the newest.
#
# `cancel-in-progress: false` because a release must never be cancelled halfway:
# the draft would be left holding some platforms' installers and a latest.json
# merged from only the legs that finished, which publishes green and updates
# nobody on the missing platforms.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Fail closed BEFORE a draft release exists. Everything below this job is
  # thorough about what it builds and signs, and none of it looks at the tag:
  # a v26.8.2 tag on a tree whose manifests still say 26.8.1 would publish a
  # 26.8.2 release full of 26.8.1 artifacts and 26.8.1 updater metadata with
  # nothing red anywhere. BUILD.md asks a human for this comparison; this is
  # the same comparison, enforced.
  preflight:
    runs-on: ubuntu-latest
    # Observed 5 s. It checks out and runs one dependency-free node script.
    timeout-minutes: 10
    # Reads version files, writes nothing. Inherits `contents: read`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No `npm ci`: the script is dependency-free on purpose, so this gate
      # cannot be taken out by an install failure.
      #
      # The success line is asserted, not assumed. A gate whose only signal is
      # exit 0 cannot distinguish "checked everything and it agreed" from "did
      # not run" -- and this script has exactly one way to do the latter, its
      # main-module guard. `set -e` catches a real rejection; the grep catches a
      # silent no-op. Captured into a variable rather than piped, because the
      # exit status of `a | tee` is tee's.
      - name: Verify the tag matches every version file
        run: |
          set -euo pipefail
          out=$(node scripts/release-preflight.mjs "${{ github.ref_name }}")
          echo "$out"
          echo "$out" | grep -q '^\[OK\] Release preflight' \
            || { echo "::error::release-preflight.mjs exited 0 without running its checks"; exit 1; }

  # Re-runs what checks.yml already ran on main, on purpose. checks.yml fires on
  # push and pull_request; a tag push creates no such event, so a tag pushed in
  # the same moment as the commit races its own checks run -- and the tree that
  # is about to be signed and published would otherwise have been gated by a run
  # against a different ref, or by none at all. AGENTS.md records the concrete
  # case: a cfg-gated unused import passed Windows clippy and failed the Linux
  # release leg after the tag was already pushed.
  quality:
    runs-on: ubuntu-latest
    # Observed max 18 min 52 s (2026-07-24, cold Rust cache); 10-15 min warm.
    # `npm run quality` is the full frontend + clippy + cargo test gate.
    timeout-minutes: 40
    # Compiles and tests only. Inherits `contents: read`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # v1 TAG, not the `stable` branch: only a tag is a ref dependabot can
      # advance (see .github/dependabot.yml). The `stable` branch works by
      # patching `default: stable` onto this input, and the tag has no default,
      # so `toolchain:` is required here and installs exactly what the branch
      # did.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Package list shared with checks.yml -- see .github/tauri-linux-deps.txt.
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          # Assigned to a variable, not inlined into the apt command. With
          # `set -e` a failed command substitution in an ASSIGNMENT aborts,
          # whereas `apt-get install -y $(grep ...)` would swallow a missing or
          # renamed list file: apt-get with no package arguments exits 0, so the
          # step would go green having installed nothing and the failure would
          # surface later as an unrelated compile error.
          deps=$(grep -vE '^\s*(#|$)' .github/tauri-linux-deps.txt)
          [ -n "$deps" ] || { echo "::error::.github/tauri-linux-deps.txt resolved to no packages"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y $deps

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: quality

      - name: Install frontend dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

  create-release:
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    # Observed max 7 s -- one `gh release create` plus a checkout.
    timeout-minutes: 10
    permissions:
      # `gh release create` -- releases are part of the contents scope.
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Draft, not published: a platform build failure in the matrix below
        # must not leave a live release with missing artifacts (happened per
        # CHANGELOG 26.5.4). The `publish` job flips this to non-draft only
        # after every build leg succeeds. Export the numeric release id so the
        # build legs can upload BY ID: GitHub's get-release-by-tag REST endpoint
        # (which tauri-action uses when given `tagName`) returns 404 for a draft,
        # so tagName-based upload fails until the release is published.
        run: |
          gh release create ${{ github.ref_name }} --draft --title "dblitz ${{ github.ref_name }}" --notes "See [CHANGELOG.md](https://github.com/tstone-1/dblitz/blob/main/CHANGELOG.md) for details."
          echo "release_id=$(gh release view ${{ github.ref_name }} --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      # SERIAL, deliberately. tauri-action builds the updater's `latest.json` by
      # read-modify-write against the release asset: download the existing one,
      # merge this platform's entries, delete it, re-upload. That is not atomic.
      # With four legs running at once — two of them macOS — several can read the
      # same pre-merge state, and the last upload wins, silently dropping the
      # other platforms' entries. Nothing fails; the published release just
      # quietly updates one platform. Serializing costs wall-clock and nothing
      # else. `src/lib/updaterConfig.test.ts` asserts this stays in place.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: ''
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: ''

    runs-on: ${{ matrix.os }}
    # Observed max 42 min 56 s (ubuntu-latest, 2026-08-05, cold Rust cache);
    # 4-10 min per leg warm. AGENTS.md warns that a cold cache alone can push a
    # release leg past 20 minutes, so this is deliberately generous -- it exists
    # to stop a hung notarization submission or a wedged runner, not to police
    # build time. Note this bounds ONE leg: the matrix is max-parallel: 1, so
    # the job's wall clock is up to four of these in series.
    timeout-minutes: 90
    permissions:
      # tauri-action uploads installers to the draft release; the DMG staple
      # step and the portable-exe step each run `gh release upload`.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # v1 TAG, not the `stable` branch: only a tag is a ref dependabot can
      # advance (see .github/dependabot.yml). The `stable` branch works by
      # patching `default: stable` onto this input, and the tag has no default,
      # so `toolchain:` is required here and installs exactly what the branch
      # did.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # Package list shared with checks.yml -- see .github/tauri-linux-deps.txt.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # Assigned to a variable, not inlined into the apt command. With
          # `set -e` a failed command substitution in an ASSIGNMENT aborts,
          # whereas `apt-get install -y $(grep ...)` would swallow a missing or
          # renamed list file: apt-get with no package arguments exits 0, so the
          # step would go green having installed nothing and the failure would
          # surface later as an unrelated compile error.
          deps=$(grep -vE '^\s*(#|$)' .github/tauri-linux-deps.txt)
          [ -n "$deps" ] || { echo "::error::.github/tauri-linux-deps.txt resolved to no packages"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y $deps

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # macOS Developer ID signing + notarization.
      #
      # The vars are exported through $GITHUB_ENV rather than listed in the
      # build step's `env:` block, and that is load-bearing. A fork has none of
      # these secrets; `env:` would then hand the Tauri CLI an EMPTY
      # APPLE_SIGNING_IDENTITY, which it treats as "sign with this identity"
      # and fails on. Exporting conditionally leaves them genuinely unset, so
      # the CLI falls back to the ad-hoc "-" in tauri.conf.json and the fork
      # still builds.
      #
      # The CLI does the keychain import itself from APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD - no manual `security create-keychain` step
      # is needed, and it sets the key partition list so codesign never blocks
      # on an interactive prompt.
      - name: Prepare Apple signing and notarization
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          # Check ALL SIX, not just two. A rotation that lands five of them
          # leaves the build "signed" by a path that skips notarization, and
          # every gate below is conditioned on the identity being set - so the
          # exact failure they exist to catch used to skip them both.
          MISSING=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || MISSING="$MISSING $v"
          done

          if [ -n "$MISSING" ]; then
            # A fork has none of these and must still build; the canonical repo
            # having none of them is a broken release, and publishing an
            # unnotarized macOS build that Gatekeeper rejects is worse than
            # publishing nothing. README.md promises notarized builds.
            if [ "$GITHUB_REPOSITORY" = "tstone-1/dblitz" ]; then
              echo "::error::Apple signing secrets missing in the canonical repo:$MISSING"
              echo "::error::Refusing to publish an unnotarized macOS build. Re-set the repo secrets (BUILD.md)."
              exit 1
            fi
            echo "::warning::Apple signing secrets absent$MISSING - building ad-hoc signed and UNNOTARIZED."
            exit 0
          fi

          # notarytool wants the key as a file on disk. RUNNER_TEMP is wiped
          # with the runner, so the key does not outlive the job.
          KEYS="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYS"
          KEYFILE="$KEYS/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # Heredoc form for the certificate: base64 may arrive wrapped, and a
          # multi-line value breaks the plain KEY=VALUE form.
          {
            echo "APPLE_CERTIFICATE<<__TAURI_EOF__"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "__TAURI_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEYFILE"
          } >> "$GITHUB_ENV"
          echo "Apple signing enabled for this build."

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key for the updater. Every update payload is signed with it
          # and verified against `plugins.updater.pubkey` in tauri.conf.json
          # before install. Independent of the Apple Developer ID signing above:
          # different key, different purpose. Apple's signature authenticates the
          # bundle to Gatekeeper; this one authenticates the update payload to an
          # already-installed dblitz, and it is the only control on that path on
          # Windows and Linux, which are unsigned. Losing this key
          # permanently orphans the installed base (a new key cannot sign for
          # clients holding the old pubkey), so it is backed up outside CI.
          # NOTE: this takes the key file's *contents*, not a path.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the draft by numeric id, not tag — a draft is invisible to
          # the get-release-by-tag endpoint tauri-action uses for `tagName`.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The action defaults this to false, which would put the MSI in
          # latest.json while README.md points users at the NSIS setup.exe. An
          # MSI update on top of an NSIS install produces a second, parallel
          # installation instead of an upgrade.
          updaterJsonPreferNsis: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # Tauri's bundler notarizes and staples the .app, then builds the DMG and
      # only SIGNS it — the DMG itself is left unnotarized, and
      # `spctl -a -t open` rejects it as "Unnotarized Developer ID". Since the
      # DMG is what users download (directly, and via the Homebrew cask),
      # opening it would still produce "Apple cannot check it for malicious
      # software". So notarize and staple the DMG too, then replace the asset
      # tauri-action already uploaded. The app inside is unaffected — it is
      # already stapled, and so is the updater tarball.
      #
      # This runs before the `publish` job flips the release out of draft, and
      # `gh release upload` resolves a draft by tag fine (same as the portable
      # exe step below). The `update-tap` job hashes the DMG only after
      # publish, so the cask picks up the stapled bytes, not the pre-staple
      # ones.
      - name: Notarize and staple the macOS DMG
        if: matrix.os == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 \
            | grep -q "source=Notarized Developer ID" \
            || { echo "::error::DMG is still not notarized after stapling"; exit 1; }
          echo "Replacing the uploaded DMG with the stapled one"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber \
            --repo "$GITHUB_REPOSITORY"

      # A skipped notarization does NOT fail the build: when the credentials
      # are missing or malformed the bundler logs "skipping app notarization"
      # and exits 0, producing a signed-but-unnotarized app that Gatekeeper
      # rejects on any machine that has never seen it. Same looks-green shape
      # as a release with no latest.json. Gate on the artifact itself so that
      # cannot ship silently.
      # The condition deliberately includes the canonical repo REGARDLESS of
      # whether an identity got exported. Gating purely on
      # `env.APPLE_SIGNING_IDENTITY != ''` meant a missing secret skipped the
      # very check written to catch a missing secret. The prep step above now
      # fails first in that case, so this arm is the second lock rather than
      # the only one - but a gate that cannot run in its own failure case is
      # not a gate, and this one now runs on every canonical macOS build.
      - name: Verify the macOS build is signed, notarized and stapled
        if: >-
          matrix.os == 'macos-latest'
          && (env.APPLE_SIGNING_IDENTITY != ''
          || github.repository == 'tstone-1/dblitz')
        run: |
          set -euo pipefail
          APP=src-tauri/target/${{ matrix.target }}/release/bundle/macos/dblitz.app
          codesign -dv --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::not signed with a Developer ID identity"; exit 1; }
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime missing - notarization cannot succeed"; exit 1; }
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP" 2>&1 | grep -q "source=Notarized Developer ID" \
            || { echo "::error::Gatekeeper does not see this as notarized"; exit 1; }
          echo "macOS build verified: Developer ID signed, notarized, stapled."

      - name: Upload portable exe
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} src-tauri/target/release/dblitz.exe --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Observed max 6 s -- one `gh release edit`.
    timeout-minutes: 10
    permissions:
      # `gh release edit --draft=false`.
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Every build matrix leg succeeded (needs: build), so the release now
        # has artifacts for every platform - flip it from draft to published.
        run: gh release edit ${{ github.ref_name }} --draft=false --repo ${{ github.repository }}

  update-tap:
    needs: publish
    runs-on: ubuntu-latest
    # Observed max 8 s -- two DMG downloads, a sed and a push.
    timeout-minutes: 15
    # No GITHUB_TOKEN permissions at all: every gh and git call in this job
    # authenticates as TAP_GITHUB_TOKEN instead. The download reads a published
    # release of this PUBLIC repo, which a fine-grained PAT can do without that
    # repo being in its selected set; the push targets a different repository,
    # which GITHUB_TOKEN could never reach.
    permissions: {}
    steps:
      - name: Bump Homebrew cask in tstone-1/homebrew-dblitz
        env:
          # Fine-grained PAT with Contents:read/write on tstone-1/homebrew-dblitz.
          # The default GITHUB_TOKEN cannot push to a different repository.
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC_REPO="${{ github.repository }}"
          TAP_REPO="tstone-1/homebrew-dblitz"

          # Pull the two macOS DMGs the build job just uploaded to this release.
          gh release download "v${VERSION}" --repo "$SRC_REPO" \
            --pattern "dblitz_${VERSION}_aarch64.dmg" \
            --pattern "dblitz_${VERSION}_x64.dmg" \
            -D dmg

          ARM_SHA=$(sha256sum "dmg/dblitz_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          INTEL_SHA=$(sha256sum "dmg/dblitz_${VERSION}_x64.dmg" | cut -d' ' -f1)

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap

          # In-place edit preserves the rest of the cask (desc, app, zap stanza).
          sed -i \
            -e "s|^  version \"[^\"]*\"|  version \"${VERSION}\"|" \
            -e "s|arm:   \"[0-9a-f]\{64\}\"|arm:   \"${ARM_SHA}\"|" \
            -e "s|intel: \"[0-9a-f]\{64\}\"|intel: \"${INTEL_SHA}\"|" \
            Casks/dblitz.rb

          # Fail loudly if the substitutions didn't land (cask format drifted).
          grep -q "version \"${VERSION}\"" Casks/dblitz.rb
          grep -q "\"${ARM_SHA}\""         Casks/dblitz.rb
          grep -q "\"${INTEL_SHA}\""       Casks/dblitz.rb

          if git diff --quiet; then
            echo "Cask already at ${VERSION}; nothing to do."
            exit 0
          fi

          git config user.name "tstone-1"
          git config user.email "48162401+tstone-1@users.noreply.github.com"
          git commit -am "Bump dblitz cask to v${VERSION}"
          git push origin HEAD:main
