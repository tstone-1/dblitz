name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs when a branch is pushed twice in quick succession.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # The release gate (`npm run quality`) builds before tagging, so a build
      # that only breaks under Vite's production pass -- a bad import, an
      # adapter-static prerender failure -- would otherwise surface for the
      # first time at release time, on a commit that is already on main.
      - name: Build
        run: npm run build

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 on Linux pulls in webkit2gtk-4.1 (Ubuntu 24.04+) and a few
      # X11/glib helpers via its build deps. Required for `cargo check`,
      # `cargo clippy`, and `cargo test` to compile the lib crate.
      - name: Install Tauri Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Format check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # The one check that crosses the webview <-> IPC seam. Every unit test above
  # runs below it: this builds the real binary, launches it under tauri-driver
  # against a generated fixture database, and asserts a row of that database
  # renders in the grid -- proving bundled assets load, the launch argument
  # reaches `get_initial_file`, `open_database`/`query_table` cross IPC, and the
  # grid paints the result. Linux only: tauri-driver has no macOS backend.
  #
  # KNOWN GAP, measured rather than assumed (2026-08-05): this job does NOT
  # catch removal of `connect-src ipc: http://ipc.localhost` from the CSP. That
  # was tested directly -- the directive was deleted on a throwaway branch and
  # all five jobs, this one included, stayed green. A same-run probe showed a
  # cross-origin fetch still blocked, so the CSP is enforced; wry's Linux IPC
  # simply is not gated by `connect-src`. That trap is a WebView2/WKWebView
  # phenomenon, so catching it needs a Windows leg (tauri-driver supports
  # Windows via msedgedriver). Until one exists, treat the `connect-src` line
  # in tauri.conf.json as guarded by review only -- not by this job.
  smoke:
    name: Smoke (packaged app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Same Tauri build deps as the backend job, plus the WebDriver host for
      # webkit2gtk and a virtual display for the headless runner.
      - name: Install Tauri Linux build deps and WebDriver host
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # --debug keeps the compile fast; --no-bundle skips packaging (and with
      # it the updater signing step, which needs a secret this workflow does
      # not have). The frontend still goes through Vite's production build via
      # beforeBuildCommand, and the webview loads it under the production CSP
      # -- which is exactly the seam being tested.
      - name: Build app (debug profile, bundled frontend assets)
        run: npx tauri build --debug --no-bundle

      - name: Run smoke test
        run: xvfb-run --auto-servernum node scripts/smoke-test.mjs
