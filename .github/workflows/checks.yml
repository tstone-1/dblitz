name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: nothing in this workflow writes to the
# repository. Jobs that need more must ask for it explicitly, so a step added
# later cannot silently inherit a write token.
permissions:
  contents: read

# Cancel superseded runs when a branch is pushed twice in quick succession.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check + test)
    runs-on: ubuntu-latest
    # Observed max 26 s across the last 8 runs (2026-08-14 .. 2026-09-01).
    # 2x that is under a minute, which would redden on a slow npm registry
    # rather than on a defect, so this is a hang bound and not a budget: the
    # job installs from the network, and the value only has to be far below
    # GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # The release gate (`npm run quality`) builds before tagging, so a build
      # that only breaks under Vite's production pass -- a bad import, an
      # adapter-static prerender failure -- would otherwise surface for the
      # first time at release time, on a commit that is already on main.
      - name: Build
        run: npm run build

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Observed max 22 min 39 s (windows-latest, 2026-08-14, cold Rust cache);
    # a warm cache is 2-4 min on every OS. One value covers all three legs, so
    # it is set from the slowest.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the v1 TAG, not to the `stable` branch. Both install the same
      # toolchain, but only a tag is a ref dependabot can advance -- see the
      # note in .github/dependabot.yml. `toolchain:` is required at the v1 tag:
      # the `stable` branch's whole mechanism is a one-commit patch that sets
      # `default: stable` on that input, and the tag carries no such default.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 on Linux pulls in webkit2gtk-4.1 (Ubuntu 24.04+) and a few
      # X11/glib helpers via its build deps. Required for `cargo check`,
      # `cargo clippy`, and `cargo test` to compile the lib crate.
      # The package list is shared with release.yml -- see the header of
      # .github/tauri-linux-deps.txt for why it is one file.
      - name: Install Tauri Linux build deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Assigned to a variable, not inlined into the apt command. With
          # `set -e` a failed command substitution in an ASSIGNMENT aborts,
          # whereas `apt-get install -y $(grep ...)` would swallow a missing or
          # renamed list file: apt-get with no package arguments exits 0, so the
          # step would go green having installed nothing and the failure would
          # surface later as an unrelated compile error.
          deps=$(grep -vE '^\s*(#|$)' .github/tauri-linux-deps.txt)
          [ -n "$deps" ] || { echo "::error::.github/tauri-linux-deps.txt resolved to no packages"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y $deps

      - name: Format check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # The one check that crosses the webview <-> IPC seam. Every unit test above
  # runs below it: this builds the real binary, launches it under tauri-driver
  # against a generated fixture database, and asserts a row of that database
  # renders in the grid -- proving bundled assets load, the launch argument
  # reaches `get_initial_file`, `open_database`/`query_table` cross IPC, and the
  # grid paints the result. Linux only: tauri-driver has no macOS backend.
  #
  # KNOWN GAP, measured rather than assumed (2026-08-05): this job does NOT
  # catch removal of `connect-src ipc: http://ipc.localhost` from the CSP. That
  # was tested directly -- the directive was deleted on a throwaway branch and
  # all five jobs, this one included, stayed green. A same-run probe showed a
  # cross-origin fetch still blocked, so the CSP is enforced; wry's Linux IPC
  # simply is not gated by `connect-src`. That trap is a WebView2/WKWebView
  # phenomenon, so catching it needs a Windows leg (tauri-driver supports
  # Windows via msedgedriver). Until one exists, treat the `connect-src` line
  # in tauri.conf.json as guarded by review only -- not by this job.
  smoke:
    name: Smoke (packaged app)
    runs-on: ubuntu-latest
    # Observed max 10 min 6 s (2026-08-14, cold Rust cache + `cargo install
    # tauri-driver`); 2-8 min warm. The script carries its own 10-minute
    # deadline so a wedged WebDriver session fails with a diagnostic well
    # inside this bound -- this is only the outer stop.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # See the backend job for why this is the v1 tag with an explicit
      # `toolchain:` rather than the `stable` branch head.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # The shared Tauri build list, plus the two extras only this job needs:
      # the WebDriver host tauri-driver proxies to, and a virtual display for
      # the headless runner. Extras go on the command line rather than into the
      # shared file, which stays the Tauri prerequisites and nothing else.
      - name: Install Tauri Linux build deps and WebDriver host
        run: |
          set -euo pipefail
          # Assigned to a variable, not inlined into the apt command. With
          # `set -e` a failed command substitution in an ASSIGNMENT aborts,
          # whereas `apt-get install -y $(grep ...)` would swallow a missing or
          # renamed list file: apt-get with no package arguments exits 0, so the
          # step would go green having installed nothing and the failure would
          # surface later as an unrelated compile error.
          deps=$(grep -vE '^\s*(#|$)' .github/tauri-linux-deps.txt)
          [ -n "$deps" ] || { echo "::error::.github/tauri-linux-deps.txt resolved to no packages"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y $deps webkit2gtk-driver xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # --debug keeps the compile fast; --no-bundle skips packaging (and with
      # it the updater signing step, which needs a secret this workflow does
      # not have). The frontend still goes through Vite's production build via
      # beforeBuildCommand, and the webview loads it under the production CSP
      # -- which is exactly the seam being tested.
      - name: Build app (debug profile, bundled frontend assets)
        run: npx tauri build --debug --no-bundle

      - name: Run smoke test
        run: xvfb-run --auto-servernum node scripts/smoke-test.mjs
