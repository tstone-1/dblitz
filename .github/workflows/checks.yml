name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs when a branch is pushed twice in quick succession.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # The release gate (`npm run quality`) builds before tagging, so a build
      # that only breaks under Vite's production pass -- a bad import, an
      # adapter-static prerender failure -- would otherwise surface for the
      # first time at release time, on a commit that is already on main.
      - name: Build
        run: npm run build

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 on Linux pulls in webkit2gtk-4.1 (Ubuntu 24.04+) and a few
      # X11/glib helpers via its build deps. Required for `cargo check`,
      # `cargo clippy`, and `cargo test` to compile the lib crate.
      - name: Install Tauri Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Format check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # The one check that crosses the webview <-> IPC seam. Every unit test above
  # runs below it, so the defect class this job exists for -- a CSP or
  # capability regression that breaks production IPC while `tauri dev` stays
  # healthy (the `connect-src ipc:` trap documented in AGENTS.md) -- is
  # invisible to all of them. Builds the real binary (debug profile, but with
  # bundled frontend assets and the production CSP applied), launches it under
  # tauri-driver against a generated fixture database, and asserts a grid row
  # renders. Linux only: tauri-driver has no macOS backend.
  smoke:
    name: Smoke (packaged app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Same Tauri build deps as the backend job, plus the WebDriver host for
      # webkit2gtk and a virtual display for the headless runner.
      - name: Install Tauri Linux build deps and WebDriver host
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # --debug keeps the compile fast; --no-bundle skips packaging (and with
      # it the updater signing step, which needs a secret this workflow does
      # not have). The frontend still goes through Vite's production build via
      # beforeBuildCommand, and the webview loads it under the production CSP
      # -- which is exactly the seam being tested.
      - name: Build app (debug profile, bundled frontend assets)
        run: npx tauri build --debug --no-bundle

      - name: Run smoke test
        run: xvfb-run --auto-servernum node scripts/smoke-test.mjs
