version: 2

# The workflows pin every action to a full commit SHA, which is the point:
# whoever controls a mutable tag controls the code that receives the updater's
# minisign private key and the Apple Developer ID material in the release build
# job. A SHA pin makes an upstream change arrive as a reviewable diff.
#
# The cost of pinning is that the pins go stale silently, including security
# fixes, so this exists to turn each one into a pull request. Dependabot
# rewrites the SHA and the trailing `# vX.Y.Z` comment together, which keeps
# `src/lib/releaseWorkflow.test.ts` satisfied and keeps the comment honest.
#
# The promise above only holds for a SHA that names a TAG. Dependabot resolves
# a pinned SHA against the action's releases, so a SHA that is merely a branch
# head is invisible to it and stays frozen forever while the comment beside it
# goes stale -- which is the failure this file exists to prevent, wearing the
# costume of the fix.
#
# `dtolnay/rust-toolchain` was pinned that way until 2026-09-06: at
# 4360b52 (`stable` branch head), with a `# stable branch @ 2026-08-23` comment
# no tool could ever advance. The repository has exactly one tag, `v1`, so the
# workflows now pin its SHA and pass `toolchain: stable` explicitly. That
# `with:` is load-bearing, not decoration: the `stable` branch IS a one-commit
# patch setting `default: stable` on that input, and at the v1 tag the input is
# `required: true` with no default -- so pinning to the tag without it makes
# every Setup Rust step exit 1 with "'toolchain' is a required input". Anyone
# tidying the `with:` away will find that out in CI.
#
# Before adding a new action, check `gh api repos/<owner>/<repo>/tags`. If it
# has none, its SHA pin is a manual chore, and it belongs in a comment here
# saying so rather than in a group that silently never fires.
#
# Actions only. npm and cargo updates are applied by hand during release prep
# (AGENTS.md, "Dependency Management"), where a held-back major is a decision
# rather than a PR to merge.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      # Actions that only ever run a check. Grouping these into one PR is fine:
      # none of them is handed a secret, so the worst a bad bump does is redden
      # CI, which is the point of CI.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri-apps/tauri-action"
      # tauri-action gets its own group because it is the one action that
      # receives the updater's minisign private key, the Apple credentials and a
      # contents-write token — and because it is the one whose breakage is
      # silent: a bad `latest.json` publishes green and simply updates nobody
      # (BUILD.md says so twice).
      #
      # The first grouped PR this file produced put `tauri-action` v0.6.2 -> v1.0.0
      # — a breaking change to the updater payload's filenames — in the same diff
      # as two routine GitHub-owned bumps. That is the shape that gets merged on
      # a glance. Alone in its own PR it cannot ride along with anything, and
      # AGENTS.md's rule that a major is a decision rather than a line item has
      # something to attach to.
      release-critical:
        patterns:
          - "tauri-apps/tauri-action"
