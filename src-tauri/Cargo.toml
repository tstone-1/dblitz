[package]
name = "dblitz"
version = "26.7.4"
description = "Read-only SQLite browser"
authors = ["tstone-1"]
edition = "2021"

[lib]
name = "dblitz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "column_decltype"] }
regex = "1.13"
sha2 = "0.11"
hex = "0.4"
dirs = "6"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_xlsxwriter = "0.96.0"
tauri-plugin-opener = "2.5.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Used to register opened databases with the macOS Dock / "Open Recent" menu via
# NSDocumentController — the AppKit counterpart to Windows' SHAddToRecentDocs.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSDocumentController"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"

# Dev builds: optimize everything for near-release perf, keep debuginfo
[profile.dev]
opt-level = 1

# Optimize all dependencies at full release level
[profile.dev.package."*"]
opt-level = 2

# SQLite C code gets maximum optimization
[profile.dev.package.libsqlite3-sys]
opt-level = 3
